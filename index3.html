<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=Text Formatting Tags, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p><strong>Important text</strong> and <b>bold text</b>.</p>
    <p>Water is represented as H<sub>2</sub>O.</p>
    <p>Einstein's theory is E=mc<sup>2</sup></p>
    <p><del>This text is deleted</del></p>
    <p><blockquote><pre>Preformatted text <br> Line 1 <br> Line 2</pre></blockquote></p>
 	<p><blockquote><blockquote>This is a blockquote with a citation.</blockquote></blockquote></p>
    <p><cite>Source of the citation</cite></p>
    <hr>
</body>
</html>
